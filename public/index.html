<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yacht Planner · Private Yacht Club</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root {
  --navy:      #0C1C38;
  --navy-mid:  #132040;
  --navy-card: #162848;
  --gold:      #B8932A;
  --gold-lt:   #D4AF6A;
  --cream:     #F9F6F0;
  --green:     #7AB89A;
  --blue:      #6AA0BA;
  --red:       #C48888;
  --purple:    #9888B8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--navy); color: var(--cream); min-height: 100vh; }
button { cursor: pointer; font-family: inherit; transition: opacity .15s; }
button:hover:not(:disabled) { opacity: .85; }
button:disabled { opacity: .35; cursor: default; }
a { text-decoration: none; }

/* Modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 16px;
  animation: fadeIn .15s ease;
}
.modal {
  background: var(--navy-mid); border-radius: 14px;
  border: 1px solid var(--gold); max-width: 680px; width: 100%;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,.6);
  animation: slideUp .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Toast */
.toast {
  position: fixed; top: 20px; right: 20px; z-index: 200;
  background: var(--navy-mid); color: var(--cream);
  border-left: 4px solid var(--gold);
  padding: 12px 20px; border-radius: 8px;
  font-weight: 600; font-size: 14px; max-width: 360px;
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
  animation: toastIn .25s ease;
}
@keyframes toastIn { from { transform: translateX(80px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Week card update animation */
@keyframes cardPop {
  0%   { transform: scale(.98); opacity: .7; }
  60%  { transform: scale(1.01); }
  100% { transform: scale(1); opacity: 1; }
}
.card-updated { animation: cardPop .4s ease; }

/* Mobile */
@media (max-width: 640px) {
  .grid-3 { grid-template-columns: 1fr !important; }
  .grid-2 { grid-template-columns: 1fr !important; }
  .modal {
    max-width: 100%; border-radius: 12px 12px 0 0;
    position: fixed; bottom: 0; left: 0; right: 0;
    max-height: 85vh; margin: 0;
  }
  .modal-bg { align-items: flex-end; padding: 0; }
  .charter-grid { grid-template-columns: repeat(2,1fr) !important; }
  .stats-scroll { overflow-x: auto; }
  h1 { font-size: 16px !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── CONFIG ─────────────────────────────────────────────────────────────────────
const YEAR0 = 2026;
const WP = 245000;
const CR = 325000;

const O = {
  A: { name: "Owner A", label: "A", c: "#F0EBE1", bg: "#1A1A24", bd: "#F0EBE133", emoji: "⬜" },
  B: { name: "Owner B", label: "B", c: "#7FA8C4", bg: "#0C1E2C", bd: "#7FA8C433", emoji: "◻" },
  C: { name: "Owner C", label: "C", c: "#A888C0", bg: "#180E22", bd: "#A888C033", emoji: "◻" },
};

const EQ = {1:"Early Season",2:"Early Summer",3:"High Season",4:"★ HIGH SUMMER",5:"★ HIGH SUMMER",6:"Late Season"};
const KQ = {1:"Pre-Season",2:"★ CHRISTMAS",3:"★ NEW YEAR",4:"Peak Season",5:"Late Season",6:"Off-Season"};
const MO = ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function getOwner() {
  const p = new URLSearchParams(window.location.search);
  const o = (p.get('owner') || '').toUpperCase();
  return ['A','B','C'].includes(o) ? o : 'A';
}
const ME = getOwner();

function fmt(d)  { const x = new Date(d); return `${String(x.getDate()).padStart(2,'0')}.${MO[x.getMonth()+1]}.${x.getFullYear()}`; }
function fmts(d) { const x = new Date(d); return `${String(x.getDate()).padStart(2,'0')}.${MO[x.getMonth()+1]}`; }
function eur(n)  { return "€ " + (n/1000).toFixed(0) + "k"; }

function pendingReq(reqs, wid) {
  return reqs.find(r => r.status === 'pending' && (r.myWid === wid || r.theirWid === wid || r.tgtWid === wid));
}
function doneReq(reqs, wid) {
  return reqs.find(r => r.status === 'accepted' && (r.myWid === wid || r.theirWid === wid || r.tgtWid === wid));
}
function allWeeks(slots) { return slots.flatMap(s => s.weeks); }

function buildSlots(weeks) {
  const slotMap = {};
  weeks.forEach(w => {
    if (!slotMap[w.slotId]) {
      slotMap[w.slotId] = {
        id: w.slotId, yr: w.yr, sn: w.sn, type: w.type,
        origOwner: w.origOwner, prem: w.isPremium,
        qual: w.season,
        label: w.slotLabel, slabel: w.slotShort,
        start: w.start, end: null, weeks: []
      };
    }
    slotMap[w.slotId].weeks.push(w);
  });
  Object.values(slotMap).forEach(s => {
    s.weeks.sort((a, b) => a.wn - b.wn);
    s.end = s.weeks[s.weeks.length - 1].end;
  });
  return Object.values(slotMap).sort((a, b) => {
    if (a.yr !== b.yr) return a.yr - b.yr;
    if (a.type !== b.type) return a.type === 'EU' ? -1 : 1;
    return a.sn - b.sn;
  });
}

// ── PILL ──────────────────────────────────────────────────────────────────────
const Pill = ({ bg, color = '#fff', children }) => (
  <span style={{
    display: 'inline-block', padding: '2px 9px', borderRadius: 20,
    fontSize: 13, fontWeight: 700, background: bg, color, whiteSpace: 'nowrap'
  }}>{children}</span>
);

// ── WEEK CARD ─────────────────────────────────────────────────────────────────
function WeekCard({ week, slots, reqs, onAction }) {
  const isMine = week.owner === ME;
  const ow     = O[week.owner];
  const isUse  = week.status === 'use';
  const isCh   = week.status === 'charter';
  const pend   = pendingReq(reqs, week.id);
  const doneR  = doneReq(reqs, week.id);
  const locked = !!(pend || doneR);

  const counter = pend && pend.type === 'swap'
    ? allWeeks(slots).find(w => w.id === (pend.myWid === week.id ? pend.theirWid : pend.myWid))
    : null;

  const statusTxt = doneR
    ? (doneR.type === 'swap' ? 'Swapped' : doneR.type === 'buy' ? 'Purchased' : 'Sold')
    : pend
      ? (pend.type === 'swap' && counter
          ? `Swap ↔ ${fmts(counter.start)}–${fmts(counter.end)}`
          : 'Request pending')
      : isUse ? 'In use'
      : isCh  ? 'Chartered'
      : 'Available';

  const WLABELS = ['Week 1', 'Week 2', 'Week 3'];

  const accentColor = locked ? 'var(--gold)' : ow.c;
  const statusBg    = locked ? ow.c + '22' : isUse ? '#0F332455' : isCh ? '#10203555' : 'rgba(249,246,240,.06)';
  const statusColor = locked ? 'var(--gold)' : isUse ? '#7AB89A' : isCh ? '#6AA0BA' : 'rgba(249,246,240,.45)';
  const statusIcon  = locked ? (pend ? '…' : '✓') : isUse ? '✓' : isCh ? '~' : '○';

  return (
    <div className="card-updated" style={{
      borderRadius: 8,
      background: isMine ? '#18284A' : 'var(--navy-mid)',
      borderLeft: `4px solid ${accentColor}`,
      border: `1px solid ${ow.c}33`,
      borderLeftWidth: 4, borderLeftColor: accentColor,
      overflow: 'hidden', marginBottom: 5,
      boxShadow: isMine ? `0 2px 10px ${ow.c}22` : 'none',
    }}>
      <div style={{ padding: '10px 12px', display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
        {/* Owner avatar */}
        <div style={{
          width: 26, height: 26, borderRadius: '50%',
          background: ow.c + (isMine ? 'dd' : '55'),
          border: `2px solid ${ow.c}`,
          color: isMine ? 'var(--navy)' : ow.c,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontWeight: 900, fontSize: 12, flexShrink: 0
        }}>{week.owner}</div>
        {/* Week label + dates */}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontWeight: 700, fontSize: 13, color: isMine ? 'var(--cream)' : 'rgba(249,246,240,.7)' }}>
            {WLABELS[week.wn - 1]}
            {week.isPremium && <span style={{ color: 'var(--gold)', marginLeft: 6, fontSize: 12 }}>★</span>}
          </div>
          <div style={{ fontSize: 13, color: 'rgba(249,246,240,.4)', marginTop: 1 }}>
            {fmt(week.start)} – {fmt(week.end)}
          </div>
        </div>
        {/* Status badge */}
        <span style={{ background: statusBg, color: statusColor, fontSize: 13, fontWeight: 700, borderRadius: 20, padding: '3px 10px', whiteSpace: 'nowrap' }}>
          {statusIcon} {statusTxt}
        </span>
      </div>
      {/* Action buttons */}
      {!locked && (
        <div style={{ padding: '0 12px 10px', display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {isMine ? (
            <>
              <button onClick={() => onAction(week, 'use')} style={{
                flex: '1 1 80px', padding: '7px 4px', borderRadius: 6, fontWeight: 700, fontSize: 13,
                border: `2px solid ${isUse ? '#7AB89A' : '#7AB89A44'}`,
                background: isUse ? '#0F3324' : 'transparent',
                color: '#7AB89A'
              }}>{isUse ? '✓ In use ↩' : '✓ Use'}</button>
              <button onClick={() => onAction(week, 'charter')} style={{
                flex: '1 1 90px', padding: '7px 4px', borderRadius: 6, fontWeight: 700, fontSize: 13,
                border: `2px solid ${isCh ? '#6AA0BA' : '#6AA0BA44'}`,
                background: isCh ? '#102035' : 'transparent',
                color: '#6AA0BA'
              }}>{isCh ? 'Charter ↩' : 'Charter'}</button>
              <button onClick={() => onAction(week, 'swap')} style={{
                flex: '1 1 80px', padding: '7px 4px', borderRadius: 6, fontWeight: 700, fontSize: 13,
                border: `2px solid var(--gold-lt)44`, background: 'transparent', color: 'var(--gold-lt)'
              }}>⇄ Swap</button>
              <button onClick={() => onAction(week, 'sell')} style={{
                flex: '1 1 100px', padding: '7px 4px', borderRadius: 6, fontWeight: 700, fontSize: 13,
                border: '2px solid #C4888844', background: 'transparent', color: '#C48888'
              }}>Sell</button>
            </>
          ) : (
            <button onClick={() => onAction(week, 'buy')} style={{
              width: '100%', padding: '8px 0', borderRadius: 6, fontWeight: 700, fontSize: 12,
              border: `2px solid ${ow.c}44`, background: 'transparent',
              color: ow.c
            }}>Buy week · {eur(WP)}</button>
          )}
        </div>
      )}
    </div>
  );
}

// ── SLOT PANEL ────────────────────────────────────────────────────────────────
function SlotPanel({ slot, slots, reqs, onWeekAction, onClose }) {
  const ow = O[slot.origOwner];
  const myCount = slot.weeks.filter(w => w.owner === ME).length;
  return (
    <div style={{
      gridColumn: '1 / -1', background: 'var(--navy-mid)', borderRadius: 12,
      border: `2px solid ${ow.c}`,
      boxShadow: `0 8px 40px rgba(0,0,0,.5), 0 0 0 1px ${ow.c}33`,
      overflow: 'hidden', marginTop: 6, marginBottom: 2
    }}>
      {/* Thick color bar */}
      <div style={{ height: 6, background: ow.c }} />
      {/* Panel header */}
      <div style={{ background: ow.c + '18', borderBottom: `1px solid ${ow.c}44`, padding: '14px 20px', display: 'flex', alignItems: 'center', gap: 14 }}>
        <div style={{
          width: 44, height: 44, borderRadius: '50%',
          background: ow.c, color: 'var(--navy)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontWeight: 900, fontSize: 20, flexShrink: 0,
          boxShadow: `0 0 0 3px ${ow.c}44`
        }}>{slot.origOwner}</div>
        <div style={{ flex: 1 }}>
          <div style={{ color: ow.c, fontWeight: 700, fontSize: 18 }}>
            {slot.prem ? '★ ' : ''}{slot.label}
            <span style={{ fontWeight: 400, fontSize: 13, marginLeft: 12, opacity: .6, color: 'var(--cream)' }}>
              {fmts(slot.start)} – {fmts(slot.end)}
            </span>
          </div>
          <div style={{ color: 'rgba(249,246,240,.5)', fontSize: 12, marginTop: 2 }}>
            {slot.qual} · {slot.type === 'EU' ? 'Mediterranean' : 'Caribbean'} · {ow.name}
            {myCount > 0 && <span style={{ marginLeft: 8, fontWeight: 700, color: ow.c }}>· {myCount}/3 weeks yours</span>}
          </div>
        </div>
        <button onClick={onClose} style={{
          background: 'transparent', border: `2px solid ${ow.c}`,
          color: ow.c, borderRadius: 20, padding: '8px 20px', fontWeight: 700, fontSize: 13
        }}>← Back</button>
      </div>
      <div style={{ padding: '14px 18px', display: 'flex', flexDirection: 'column', gap: 6 }}>
        {slot.weeks.map(w => (
          <WeekCard key={w.id} week={w} slots={slots} reqs={reqs}
            onAction={(w, action) => onWeekAction(w, action)} />
        ))}
      </div>
    </div>
  );
}

// ── SLOT CAL PANEL ───────────────────────────────────────────────────────────
function SlotCalPanel({ slot, slots, reqs, onWeekAction, onClose }) {
  const [selectedWkId, setSelectedWkId] = useState(null);
  const ow = O[slot.origOwner];
  const MN_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW = ['M','T','W','T','F','S','S'];
  const WLABELS = ['Week 1','Week 2','Week 3'];

  const selectedWk = selectedWkId ? slot.weeks.find(w => w.id === selectedWkId) : null;

  const startD = new Date(slot.start);
  const endD   = new Date(slot.end);
  const months = [];
  let mCur = new Date(startD.getFullYear(), startD.getMonth(), 1);
  const mLast = new Date(endD.getFullYear(), endD.getMonth(), 1);
  while (mCur <= mLast) { months.push(new Date(mCur)); mCur = new Date(mCur.getFullYear(), mCur.getMonth() + 1, 1); }

  const getDayWeek = (date) => {
    if (!date) return null;
    const iso = date.toISOString().slice(0, 10);
    return slot.weeks.find(w => iso >= w.start && iso <= w.end) || null;
  };

  const MonthGrid = ({ month }) => {
    const y = month.getFullYear(), m = month.getMonth();
    const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(y, m, d));
    return (
      <div style={{ minWidth: 196, flex: '1 1 196px' }}>
        <div style={{ fontWeight: 600, fontSize: 13, color: 'var(--gold)', marginBottom: 8, textAlign: 'center' }}>
          {MN_FULL[m]} {y}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2 }}>
          {DOW.map((d, i) => (
            <div key={i} style={{ textAlign: 'center', fontSize: 10, color: 'rgba(249,246,240,.25)', fontWeight: 600, paddingBottom: 4 }}>{d}</div>
          ))}
          {cells.map((date, i) => {
            const wk   = date ? getDayWeek(date) : null;
            const isSel = wk && selectedWk && wk.id === selectedWk.id;
            const bg = wk
              ? (isSel ? ow.c : wk.status === 'use' ? ow.c : wk.status === 'charter' ? ow.c + '66' : ow.c + '30')
              : 'transparent';
            const tc = wk
              ? (isSel || wk.status === 'use' ? 'var(--navy)' : ow.c)
              : 'rgba(249,246,240,.2)';
            return (
              <div key={i}
                onClick={() => wk && setSelectedWkId(isSel ? null : wk.id)}
                style={{
                  textAlign: 'center', fontSize: 11, padding: '5px 2px',
                  background: bg, borderRadius: 3, color: tc,
                  fontWeight: wk ? 600 : 400,
                  cursor: wk ? 'pointer' : 'default',
                  outline: isSel ? `2px solid ${ow.c}` : 'none',
                  outlineOffset: 1,
                }}>
                {date ? date.getDate() : ''}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  const myCount = slot.weeks.filter(w => w.owner === ME).length;

  return (
    <div style={{
      gridColumn: '1 / -1', background: 'var(--navy-mid)', borderRadius: 12,
      border: `2px solid ${ow.c}`,
      boxShadow: `0 8px 40px rgba(0,0,0,.5), 0 0 0 1px ${ow.c}33`,
      overflow: 'hidden', marginTop: 6, marginBottom: 2
    }}>
      <div style={{ height: 6, background: ow.c }} />
      <div style={{ background: ow.c + '18', borderBottom: `1px solid ${ow.c}44`, padding: '14px 20px', display: 'flex', alignItems: 'center', gap: 14 }}>
        <div style={{
          width: 44, height: 44, borderRadius: '50%',
          background: ow.c, color: 'var(--navy)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontWeight: 900, fontSize: 20, flexShrink: 0,
          boxShadow: `0 0 0 3px ${ow.c}44`
        }}>{slot.origOwner}</div>
        <div style={{ flex: 1 }}>
          <div style={{ color: ow.c, fontWeight: 700, fontSize: 18 }}>
            {slot.prem ? '★ ' : ''}{slot.label}
            <span style={{ fontWeight: 400, fontSize: 13, marginLeft: 12, opacity: .6, color: 'var(--cream)' }}>
              {fmts(slot.start)} – {fmts(slot.end)}
            </span>
          </div>
          <div style={{ color: 'rgba(249,246,240,.5)', fontSize: 12, marginTop: 2 }}>
            {slot.qual} · {slot.type === 'EU' ? 'Mediterranean' : 'Caribbean'} · {ow.name}
            {myCount > 0 && <span style={{ marginLeft: 8, fontWeight: 700, color: ow.c }}>· {myCount}/3 weeks yours</span>}
          </div>
        </div>
        <button onClick={onClose} style={{
          background: 'transparent', border: `2px solid ${ow.c}`,
          color: ow.c, borderRadius: 20, padding: '8px 20px', fontWeight: 700, fontSize: 13
        }}>← Back</button>
      </div>

      {/* Calendar months */}
      <div style={{ padding: '20px', display: 'flex', gap: 20, flexWrap: 'wrap', justifyContent: 'center' }}>
        {months.map((month, i) => <MonthGrid key={i} month={month} />)}
      </div>

      {/* Week chips */}
      <div style={{ padding: '0 20px 10px', display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
        {slot.weeks.map((w, i) => {
          const isActive = selectedWk && selectedWk.id === w.id;
          return (
            <button key={w.id} onClick={() => setSelectedWkId(isActive ? null : w.id)} style={{
              padding: '5px 12px', borderRadius: 20, fontWeight: 600, fontSize: 12,
              border: `2px solid ${isActive ? ow.c : ow.c + '44'}`,
              background: isActive ? ow.c + '33' : 'transparent',
              color: isActive ? ow.c : ow.c + 'aa',
            }}>
              {WLABELS[i]} · {fmts(w.start)}
            </button>
          );
        })}
        {!selectedWk && (
          <span style={{ fontSize: 11, color: 'rgba(249,246,240,.2)', marginLeft: 4 }}>
            Select a week to see actions
          </span>
        )}
      </div>

      {/* Action panel */}
      {selectedWk && (() => {
        const w = selectedWk;
        const isMine = w.owner === ME;
        const pend  = pendingReq(reqs, w.id);
        const doneR = doneReq(reqs, w.id);
        const locked = !!(pend || doneR);
        const isUse = w.status === 'use';
        const isCh  = w.status === 'charter';
        const wo = O[w.owner];
        return (
          <div style={{ padding: '0 20px 20px' }}>
            <div style={{
              background: wo.c + '12', border: `1px solid ${wo.c}33`, borderRadius: 8, padding: '12px 14px',
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10, flexWrap: 'wrap' }}>
                <div style={{ width: 22, height: 22, borderRadius: '50%', background: wo.c, color: 'var(--navy)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 12 }}>{w.owner}</div>
                <div style={{ fontWeight: 700, fontSize: 13, color: wo.c }}>{WLABELS[w.wn - 1]}</div>
                <div style={{ fontSize: 12, color: 'rgba(249,246,240,.4)' }}>{fmt(w.start)} – {fmt(w.end)}</div>
                {w.isPremium && <span style={{ color: 'var(--gold)', fontSize: 12 }}>★</span>}
                <div style={{ marginLeft: 'auto', fontSize: 11, color: locked ? 'var(--gold)' : isUse ? 'var(--green)' : isCh ? 'var(--blue)' : 'rgba(249,246,240,.3)' }}>
                  {locked ? (pend ? '… Pending' : '✓ Done') : isUse ? '✓ In use' : isCh ? 'Charter' : '○ Open'}
                </div>
              </div>
              {locked ? (
                <div style={{ fontSize: 12, color: 'var(--gold)', background: 'rgba(184,147,42,.08)', padding: '8px 12px', borderRadius: 6 }}>
                  {pend ? 'A request is pending for this week.' : 'This week has a completed transaction.'}
                </div>
              ) : (
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                  {isMine ? (
                    <>
                      <button onClick={() => onWeekAction(w, 'use')} style={{
                        flex: '1 1 80px', padding: '7px 4px', borderRadius: 6, fontWeight: 700, fontSize: 13,
                        border: `2px solid ${isUse ? '#7AB89A' : '#7AB89A44'}`,
                        background: isUse ? '#0F3324' : 'transparent', color: '#7AB89A'
                      }}>{isUse ? '✓ In use ↩' : '✓ Use'}</button>
                      <button onClick={() => onWeekAction(w, 'charter')} style={{
                        flex: '1 1 90px', padding: '7px 4px', borderRadius: 6, fontWeight: 700, fontSize: 13,
                        border: `2px solid ${isCh ? '#6AA0BA' : '#6AA0BA44'}`,
                        background: isCh ? '#102035' : 'transparent', color: '#6AA0BA'
                      }}>{isCh ? 'Charter ↩' : 'Charter'}</button>
                      <button onClick={() => onWeekAction(w, 'swap')} style={{
                        flex: '1 1 80px', padding: '7px 4px', borderRadius: 6, fontWeight: 700, fontSize: 13,
                        border: `2px solid var(--gold-lt)44`, background: 'transparent', color: 'var(--gold-lt)'
                      }}>⇄ Swap</button>

                        flex: '1 1 100px', padding: '7px 4px', borderRadius: 6, fontWeight: 700, fontSize: 13,

                      }}>Sell</button>

                  ) : (
                    <button onClick={() => onWeekAction(w, 'buy')} style={{
                      width: '100%', padding: '8px 0', borderRadius: 6, fontWeight: 700, fontSize: 12,

                    }}>Buy week · {eur(WP)}</button>

              )}

          </div>
        );
      })()}
    </div>
  );
}

// ── SLOT CARD ─────────────────────────────────────────────────────────────────
function SlotCard({ slot, reqs, expanded, onToggle }) {
  const ow      = O[slot.origOwner];
  const myW     = slot.weeks.filter(w => w.owner === ME).length;
  const anyP    = slot.weeks.some(w => pendingReq(reqs, w.id));
  const use     = slot.weeks.filter(w => w.owner === ME && w.status === 'use').length;
  const ch      = slot.weeks.filter(w => w.owner === ME && w.status === 'charter').length;
  const op      = slot.weeks.filter(w => w.owner === ME && !w.status).length;
  const hasWeeks = myW > 0;

  return (
    <div onClick={onToggle} style={{
      borderRadius: 10, overflow: 'hidden', cursor: 'pointer',
      background: 'var(--navy-card)',
      border: `1px solid ${expanded ? ow.c : ow.c + '44'}`,
      boxShadow: expanded
        ? `0 0 0 2px ${ow.c}55, 0 8px 32px rgba(0,0,0,.5)`
        : hasWeeks ? `0 3px 12px rgba(0,0,0,.4)` : '0 2px 6px rgba(0,0,0,.25)',
      opacity: hasWeeks ? 1 : 0.5,
      userSelect: 'none',
      transition: 'all .2s',
    }}>
      {/* Thick color bar — the primary differentiator */}
      <div style={{ height: 5, background: ow.c, opacity: hasWeeks ? 1 : 0.6 }} />
      {/* Header row */}
      <div style={{ background: ow.c + '18', borderBottom: `1px solid ${ow.c}30`, padding: '9px 12px', display: 'flex', alignItems: 'center', gap: 7 }}>
        {/* Owner badge */}
        <div style={{
          width: 26, height: 26, borderRadius: '50%',
          background: hasWeeks ? ow.c : ow.c + '55',
          color: hasWeeks ? 'var(--navy)' : ow.c,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontWeight: 900, fontSize: 12, flexShrink: 0,
          border: hasWeeks ? 'none' : `1.5px solid ${ow.c}`,
        }}>{slot.origOwner}</div>
        {/* Label */}
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 700, color: hasWeeks ? ow.c : ow.c + 'aa', fontSize: 12 }}>
            {slot.prem ? '★ ' : ''}{slot.label}
          </div>
        </div>
        {/* Ownership badge */}
        {myW === 3 && (
          <span style={{ background: ow.c + '33', color: ow.c, fontSize: 13, fontWeight: 700, borderRadius: 6, padding: '2px 7px', flexShrink: 0, border: `1px solid ${ow.c}55` }}>
            MY SLOT
          </span>
        )}
        {myW > 0 && myW < 3 && (
          <span style={{ background: ow.c + '22', color: ow.c, fontSize: 13, fontWeight: 700, borderRadius: 6, padding: '2px 7px', flexShrink: 0 }}>
            {myW}/3
          </span>
        )}
        {/* Status dots */}
        <div style={{ display: 'flex', gap: 3, flexShrink: 0 }}>
          {slot.weeks.map(w => {
            const p = pendingReq(reqs, w.id);
            const d = doneReq(reqs, w.id);
            return (
              <div key={w.id}
                title={p ? 'Pending' : d ? 'Completed' : w.status === 'use' ? 'In use' : w.status === 'charter' ? 'Charter' : 'Open'}
                style={{
                  width: 10, height: 10, borderRadius: 3,
                  background: p ? 'var(--gold)' : d ? 'var(--purple)'
                    : w.status === 'use' ? 'var(--green)'
                    : w.status === 'charter' ? 'var(--blue)'
                    : 'rgba(249,246,240,.15)',
                  border: `1.5px solid rgba(249,246,240,.2)`,
                }} />
            );
          })}
        </div>
        <span style={{ color: ow.c + 'aa', fontSize: 12, transform: expanded ? 'rotate(90deg)' : 'none', transition: '.2s' }}>▶</span>
      </div>
      {/* Card body */}
      <div style={{ padding: '9px 12px' }}>
        <div style={{ fontWeight: 700, fontSize: 12, color: hasWeeks ? 'var(--cream)' : 'rgba(249,246,240,.45)', marginBottom: 1 }}>
          {fmts(slot.start)} – {fmts(slot.end)}

        <div style={{ fontSize: 12, color: slot.prem ? 'var(--gold)' : 'rgba(249,246,240,.35)', fontWeight: slot.prem ? 700 : 400, marginBottom: 6 }}>
          {slot.qual}
        </div>
        {hasWeeks && (
          <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
            {use  > 0 && <Pill bg="#0F332455" color="var(--green)">{use}W ✓</Pill>}
            {ch   > 0 && <Pill bg="#10203555" color="var(--blue)">{ch}W Charter</Pill>}
            {op   > 0 && <Pill bg={ow.c + '22'} color={ow.c}>{op}W ○</Pill>}
            {anyP      && <Pill bg="rgba(184,147,42,.2)" color="var(--gold)">Pending</Pill>}
          </div>
        )}
      </div>
    </div>
  );
}

// ── STATS TABLE ───────────────────────────────────────────────────────────────
function Tabelle({ slots, reqs }) {
  const calcYear = yr => {
    const ws = yr === 'all'
      ? allWeeks(slots).filter(w => w.owner === ME)
      : allWeeks(slots).filter(w => w.owner === ME && w.yr === yr);
    let use = 0, ch = 0, sw = 0, pu = 0, sold = 0, op = 0;
    ws.forEach(w => {
      const d = doneReq(reqs, w.id);
      if (d) { if (d.type === 'swap') sw++; else if (d.type === 'buy') pu++; else sold++; return; }
      if (w.status === 'use') use++;
      else if (w.status === 'charter') ch++;
      else op++;
    });
    return { use, ch, sw, pu, sold, op, tot: use + ch + sw + pu + op, rev: ch * CR * .65 };
  };

  const rows = [
    { l: 'Year 1', sub: `EU ${YEAR0} / KAR ${YEAR0}–${YEAR0+1}`, d: calcYear(1) },
    { l: 'Year 2', sub: `EU ${YEAR0+1} / KAR ${YEAR0+1}–${YEAR0+2}`, d: calcYear(2) },
    { l: 'Year 3', sub: `EU ${YEAR0+2} / KAR ${YEAR0+2}–${YEAR0+3}`, d: calcYear(3) },
    { l: 'Total', sub: '36 Weeks', d: calcYear('all'), tot: true },
  ];
  const cols = [
    { k: 'use',  l: '✓ In Use',      bg: '#071507', c: 'var(--green)' },
    { k: 'ch',   l: 'Charter',       bg: '#051520', c: 'var(--blue)' },
    { k: 'sw',   l: '⇄ Swapped',    bg: '#120A30', c: 'var(--purple)' },
    { k: 'pu',   l: 'Purchased',     bg: '#1C1505', c: 'var(--gold)' },
    { k: 'sold', l: 'Sold',         bg: '#200A0A', c: 'var(--red)' },
    { k: 'op',   l: '○ Open',        bg: 'rgba(249,246,240,.04)', c: 'rgba(249,246,240,.35)' },
    { k: 'tot',  l: 'Σ Total',       bg: 'rgba(249,246,240,.07)', c: 'var(--cream)' },
    { k: 'rev',  l: 'Charter Revenue', bg: '#051520', c: 'var(--blue)', money: true },
  ];

  return (
    <div style={{ background: 'var(--navy-mid)', borderRadius: 12, padding: '16px 18px', border: '1px solid rgba(184,147,42,.2)', marginBottom: 20 }}>
      <div style={{ fontWeight: 700, fontSize: 14, color: 'var(--gold)', marginBottom: 12, paddingBottom: 10, borderBottom: '1px solid rgba(184,147,42,.2)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        My Week Overview
        <span style={{ fontSize: 13, color: 'rgba(249,246,240,.3)', fontWeight: 400 }}>{O[ME].name} · 36 weeks total</span>
      </div>
      <div className="stats-scroll">
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
          <thead>
            <tr style={{ background: 'rgba(249,246,240,.03)' }}>
              <th style={{ textAlign: 'left', padding: '7px 10px', fontWeight: 700, color: 'rgba(249,246,240,.35)', fontSize: 13, minWidth: 160 }}>Period</th>
              {cols.map(c => <th key={c.k} style={{ textAlign: 'center', padding: '7px 8px', fontWeight: 700, color: c.c, fontSize: 13, whiteSpace: 'nowrap', minWidth: 65 }}>{c.l}</th>)}
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i} style={{ background: r.tot ? 'rgba(184,147,42,.06)' : 'transparent', borderTop: r.tot ? '1.5px solid rgba(184,147,42,.3)' : '1px solid rgba(249,246,240,.05)' }}>
                <td style={{ padding: '9px 10px', fontWeight: r.tot ? 800 : 600, color: r.tot ? 'var(--gold)' : 'var(--cream)' }}>
                  {r.l}<div style={{ fontSize: 12, color: 'rgba(249,246,240,.3)', fontWeight: 400 }}>{r.sub}</div>
                </td>
                {cols.map(c => {
                  const v = r.d[c.k];
                  const disp = c.money ? (v > 0 ? eur(v) : '—') : (v > 0 ? `${v}W` : '—');
                  return (
                    <td key={c.k} style={{ textAlign: 'center', padding: '7px 8px' }}>
                      {v > 0
                        ? <span style={{ display: 'inline-block', padding: '2px 8px', borderRadius: 6, background: c.bg, color: c.c, fontWeight: r.tot ? 800 : 700, fontSize: r.tot ? 13 : 11 }}>{disp}</span>
                        : <span style={{ color: 'rgba(249,246,240,.12)' }}>—</span>}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

  const fw = allWeeks(slots);
  return (

function TxLog({ reqs, slots }) {
  const done2 = reqs.filter(r => r.status !== 'pending');

  const fw = allWeeks(slots);
  return (
    <div style={{ background: 'var(--navy-mid)', borderRadius: 10, padding: '12px 16px', border: '1px solid rgba(249,246,240,.07)', marginBottom: 20 }}>
      <div style={{ fontWeight: 700, fontSize: 13, color: 'var(--cream)', marginBottom: 8, paddingBottom: 8, borderBottom: '1px solid rgba(249,246,240,.07)' }}>
        Transaction History
      </div>
      {done2.map((r, i) => {
        const ok   = r.status === 'accepted';
        const myW  = r.myWid    ? fw.find(w => w.id === r.myWid)    : null;
        const thW  = r.theirWid ? fw.find(w => w.id === r.theirWid) : null;
        const tgW  = r.tgtWid   ? fw.find(w => w.id === r.tgtWid)   : null;
        const toO  = r.toOwner  ? O[r.toOwner]                       : null;
        const tl   = r.type === 'swap' ? 'Swap' : r.type === 'buy' ? 'Purchase' : 'Sale';

        if (r.type === 'swap' && myW && thW) txt = `${myW.slotShort} W${myW.wn} ⇄ ${O[r.toOwner]?.name || r.toOwner} ${thW.slotShort} W${thW.wn}`;
        if (r.type === 'buy'  && tgW)        txt = `${tgW.slotShort} W${tgW.wn} · ${eur(WP)}`;

}

// ── SLOT CALENDAR MODAL ──────────────────────────────────────────────────────
function SlotCalModal({ slot, onClose }) {
  const ow = O[slot.origOwner];
  const MN_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW = ['M','T','W','T','F','S','S'];

  const startD = new Date(slot.start);
  const endD   = new Date(slot.end);
  const months = [];
  let cur = new Date(startD.getFullYear(), startD.getMonth(), 1);
  const last = new Date(endD.getFullYear(), endD.getMonth(), 1);
  while (cur <= last) { months.push(new Date(cur)); cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); }

  const getDayWeek = (date) => {
    if (!date) return null;
    const iso = date.toISOString().slice(0, 10);
    return slot.weeks.find(w => iso >= w.start && iso <= w.end) || null;
  };

  const MonthGrid = ({ month }) => {
    const y = month.getFullYear(), m = month.getMonth();
    const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(y, m, d));
    return (
      <div style={{ minWidth: 196, flex: '1 1 196px' }}>
        <div style={{ fontWeight: 600, fontSize: 13, color: 'var(--gold)', marginBottom: 8, textAlign: 'center' }}>
          {MN_FULL[m]} {y}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2 }}>
          {DOW.map((d, i) => (
            <div key={i} style={{ textAlign: 'center', fontSize: 10, color: 'rgba(249,246,240,.25)', fontWeight: 600, paddingBottom: 4 }}>{d}</div>
          ))}
          {cells.map((date, i) => {
            const wk = date ? getDayWeek(date) : null;
            const bg = wk
              ? (wk.status === 'use' ? ow.c : wk.status === 'charter' ? ow.c + '66' : ow.c + '30')
              : 'transparent';
            const tc = wk
              ? (wk.status === 'use' ? 'var(--navy)' : ow.c)
              : 'rgba(249,246,240,.2)';
            return (
              <div key={i} style={{
                textAlign: 'center', fontSize: 11, padding: '5px 2px',
                background: bg, borderRadius: 3, color: tc,
                fontWeight: wk ? 600 : 400,
              }}>
                {date ? date.getDate() : ''}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  const use = slot.weeks.filter(w => w.status === 'use').length;
  const ch  = slot.weeks.filter(w => w.status === 'charter').length;
  const op  = slot.weeks.filter(w => !w.status).length;

  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, background: 'rgba(0,0,0,.72)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      zIndex: 200, padding: 24,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        background: 'var(--navy-mid)', borderRadius: 14,
        border: `2px solid ${ow.c}44`,
        boxShadow: '0 16px 64px rgba(0,0,0,.7)',
        maxWidth: 680, width: '100%', maxHeight: '90vh', overflowY: 'auto',
      }}>
        <div style={{ height: 5, background: ow.c, borderRadius: '12px 12px 0 0' }} />
        <div style={{ padding: '14px 20px', borderBottom: `1px solid ${ow.c}22`, display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12 }}>
          <div>
            <div style={{ color: ow.c, fontWeight: 700, fontSize: 16 }}>
              {slot.prem ? '★ ' : ''}{slot.label}
            </div>
            <div style={{ color: 'rgba(249,246,240,.4)', fontSize: 12, marginTop: 2 }}>
              {slot.qual} · {slot.type === 'EU' ? 'Mediterranean' : 'Caribbean'} · {ow.name}
            </div>
            <div style={{ display: 'flex', gap: 10, marginTop: 6 }}>
              {use > 0 && <span style={{ fontSize: 12, color: 'var(--green)' }}>✓ {use}W In Use</span>}
              {ch  > 0 && <span style={{ fontSize: 12, color: 'var(--blue)' }}>{ch}W Charter</span>}
              {op  > 0 && <span style={{ fontSize: 12, color: 'rgba(249,246,240,.3)' }}>○ {op}W Open</span>}
            </div>
          </div>
          <button onClick={onClose} style={{
            background: 'transparent', border: '1px solid rgba(249,246,240,.15)',
            borderRadius: 6, padding: '5px 10px', color: 'rgba(249,246,240,.4)',
            fontSize: 13, cursor: 'pointer', flexShrink: 0,
          }}>✕</button>
        </div>
        <div style={{ padding: '20px', display: 'flex', gap: 20, flexWrap: 'wrap', justifyContent: 'center' }}>
          {months.map((month, i) => <MonthGrid key={i} month={month} />)}
        </div>
        <div style={{ padding: '0 20px 14px', display: 'flex', gap: 14, fontSize: 11, color: 'rgba(249,246,240,.25)', alignItems: 'center' }}>
          <span>Week status:</span>
          <span><span style={{ background: ow.c + '30', padding: '1px 6px', borderRadius: 2, color: ow.c }}>open</span></span>
          <span><span style={{ background: ow.c + '66', padding: '1px 6px', borderRadius: 2, color: ow.c }}>charter</span></span>
          <span><span style={{ background: ow.c, padding: '1px 6px', borderRadius: 2, color: 'var(--navy)' }}>in use</span></span>
        </div>
      </div>
    </div>
  );
}

// ── OVERVIEW (Gantt Season Timeline) ─────────────────────────────────────────
function Overview({ slots, onSlotCal }) {
  const dayMs  = 86400000;
  const MN_LOC = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  const GanttSeason = ({ label, color, seasonSlots, seasonStart, seasonEnd }) => {
    const seasonDays = Math.round((seasonEnd - seasonStart) / dayMs) + 1;

    const mLabels = [];
    let mDate = new Date(seasonStart.getFullYear(), seasonStart.getMonth(), 1);
    while (mDate <= seasonEnd) {
      const mStart = Math.max(mDate, seasonStart);
      const mNext  = new Date(mDate.getFullYear(), mDate.getMonth() + 1, 1);
      const mEnd   = mNext > seasonEnd ? new Date(seasonEnd.getTime() + dayMs) : mNext;
      mLabels.push({
        name:  MN_LOC[mDate.getMonth()],
        left:  (mStart - seasonStart) / dayMs / seasonDays * 100,
        width: (mEnd   - mStart)      / dayMs / seasonDays * 100,
      });
      mDate = mNext;
    }

    return (
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontSize: 11, fontWeight: 600, color, marginBottom: 5, letterSpacing: 1 }}>{label}</div>
        {/* Month axis */}
        <div style={{ position: 'relative', height: 14, marginBottom: 2 }}>
          {mLabels.map((ml, i) => (
            <div key={i} style={{
              position: 'absolute', left: `${ml.left}%`, width: `${ml.width}%`,
              textAlign: 'center', fontSize: 9, color: 'rgba(249,246,240,.3)',
              fontWeight: 600, textTransform: 'uppercase', letterSpacing: .3,
              overflow: 'hidden', whiteSpace: 'nowrap',
            }}>{ml.name}</div>
          ))}
        </div>
        {/* Band row */}
        <div style={{ position: 'relative', height: 38, background: 'rgba(249,246,240,.02)', borderRadius: 4, border: '1px solid rgba(249,246,240,.06)' }}>
          {mLabels.slice(1).map((ml, i) => (
            <div key={i} style={{
              position: 'absolute', left: `${ml.left}%`, top: 0, height: '100%',
              width: 1, background: 'rgba(249,246,240,.05)',
            }} />
          ))}
          {seasonSlots.map(sl => {
            const ow = O[sl.origOwner];
            const dFromStart = Math.round((new Date(sl.start) - seasonStart) / dayMs);
            const left  = dFromStart / seasonDays * 100;
            const width = 21 / seasonDays * 100;
            const use   = sl.weeks.filter(w => w.status === 'use').length;
            const ch    = sl.weeks.filter(w => w.status === 'charter').length;
            const alpha = use > 0 ? 'cc' : ch > 0 ? '77' : '33';
            const hasMine = sl.weeks.some(w => w.owner === ME);
            const textDark = use > 0;
            return (
              <div key={sl.id}
                title={`${sl.label}: ${fmt(sl.start)} – ${fmt(sl.end)}`}
                onClick={() => onSlotCal(sl)}
                style={{
                  position: 'absolute', top: 4, left: `${left}%`, width: `${width}%`,
                  height: 30,
                  background: `linear-gradient(135deg, ${ow.c}${alpha}, ${ow.c}22)`,
                  border: `1px solid ${ow.c}55`,
                  borderRadius: 3, cursor: 'pointer',
                  display: 'flex', alignItems: 'center', paddingLeft: 5, gap: 3,
                  overflow: 'hidden',
                  boxShadow: hasMine ? `inset 0 0 0 1px ${ow.c}99` : 'none',
                }}>
                <span style={{ fontSize: 10, color: textDark ? 'var(--navy)' : ow.c, fontWeight: 700, whiteSpace: 'nowrap' }}>
                  {sl.prem ? '★ ' : ''}{sl.slabel}
                </span>
                <span style={{ fontSize: 9, color: textDark ? 'rgba(0,0,0,.45)' : ow.c + '88', whiteSpace: 'nowrap' }}>[{sl.origOwner}]</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  const Crossing = ({ label }) => (
    <div style={{
      margin: '16px 0', padding: '10px 18px',
      background: 'rgba(184,147,42,.06)',
      border: '1px solid rgba(184,147,42,.2)',
      borderLeft: '3px solid rgba(184,147,42,.5)',
      borderRadius: 6,
      display: 'flex', alignItems: 'center', gap: 12,
    }}>
      <div style={{ flex: 1, height: 1, background: 'rgba(184,147,42,.2)' }} />
      <span style={{ fontSize: 12, color: 'rgba(184,147,42,.75)', fontWeight: 600, letterSpacing: 1, whiteSpace: 'nowrap' }}>
        {label}
      </span>
      <div style={{ flex: 1, height: 1, background: 'rgba(184,147,42,.2)' }} />
    </div>
  );

  return (
    <div>
      {[1,2,3].map(yr => {
        const ey       = YEAR0 + yr - 1;
        const euSlots  = slots.filter(s => s.yr === yr && s.type === 'EU');
        const karSlots = slots.filter(s => s.yr === yr && s.type === 'KAR');
        const euStart  = new Date(ey,     4,  15);
        const euEnd    = new Date(ey,     8,  17);
        const karStart = new Date(ey,     10, 15);
        const karEnd   = new Date(ey + 1, 2,  20);
        return (
          <div key={yr} style={{ background: 'var(--navy-mid)', borderRadius: 12, padding: '16px 18px', border: '1px solid rgba(184,147,42,.15)', marginBottom: 20 }}>
            <div style={{ fontWeight: 700, fontSize: 15, color: 'var(--gold)', marginBottom: 16, paddingBottom: 10, borderBottom: '1px solid rgba(184,147,42,.15)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              Year {yr}
              <span style={{ fontSize: 12, color: 'rgba(249,246,240,.3)', fontWeight: 400 }}>Mediterranean {ey} · Caribbean {ey}–{ey+1}</span>
            </div>
            <GanttSeason label={`MEDITERRANEAN ${ey}`} color="var(--green)"
              seasonSlots={euSlots} seasonStart={euStart} seasonEnd={euEnd} />
            <Crossing label={`Atlantic Crossing · Oct–Nov ${ey}`} />
            <GanttSeason label={`CARIBBEAN ${ey}–${ey+1}`} color="var(--blue)"
              seasonSlots={karSlots} seasonStart={karStart} seasonEnd={karEnd} />
            <Crossing label={`Atlantic Crossing · Apr–May ${ey+1}`} />
          </div>
        );
      })}
    </div>
  );
}

  const [weeks,    setWeeks]    = useState([]);
  const [requests, setRequests] = useState([]);
  const [expanded, setExp]      = useState(null);
  const [tab,      setTab]      = useState('cal');
  const [yr,       setYr]       = useState('all');
  const [swapM,    setSwapM]    = useState(null);
  const [buyM,     setBuyM]     = useState(null);
  const [sellM,    setSellM]    = useState(null);
  const [slotCalM, setSlotCalM] = useState(null);
  const [toast,    setToast]    = useState(null);
  const [showAll,  setShowAll]  = useState(false);
  const pollRef = useRef(null);

  const modalOpen = !!(swapM || buyM || sellM || slotCalM);

  const fetchState = useCallback(async () => {
    try {
      const r = await fetch('/api/state');
      const d = await r.json();
      setWeeks(d.weeks   || []);
      setRequests(d.requests || []);
    } catch (e) { console.error('Poll failed', e); }
  }, []);

  // Initial load + 3s polling
  useEffect(() => {
    fetchState();
    pollRef.current = setInterval(fetchState, 3000);
    return () => clearInterval(pollRef.current);
  }, [fetchState]);

  // Pause polling while modal is open
  useEffect(() => {
    clearInterval(pollRef.current);
    if (!modalOpen) {
      pollRef.current = setInterval(fetchState, 3000);
    }
    return () => clearInterval(pollRef.current);
  }, [modalOpen, fetchState]);

  const notify = (msg, borderColor = 'var(--gold)') => {
    setToast({ msg, borderColor });
    setTimeout(() => setToast(null), 3500);
  };

  // ── Action handlers ──────────────────────────────────────────────────────
  const handleWeek = async (week, action) => {
    if (action === 'swap') { setSwapM({ week }); return; }
    if (action === 'buy')  { setBuyM({ week });  return; }
    if (action === 'sell') { setSellM({ week }); return; }
    const r = await fetch(`/api/weeks/${week.id}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ owner: ME, status: week.status === action ? null : action })
    });
    const d = await r.json();
    if (!d.ok) { notify('Error: ' + d.error, 'var(--red)'); return; }
    await fetchState();
    notify(action === 'use' ? '✓ Marked as personal use' : 'Released for charter');
  };

  const sendSwap = async (myW, thW) => {
    const r = await fetch('/api/requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'swap', fromOwner: ME, myWid: myW.id, theirWid: thW.id })
    });
    const d = await r.json();
    if (!d.ok) { notify('Error: ' + d.error, 'var(--red)'); return; }
    await fetchState();
    notify(`⇄ Swap request sent to ${O[thW.owner].name}`);
  };

  const sendBuy = async (tgW) => {
    const r = await fetch('/api/requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'buy', fromOwner: ME, tgtWid: tgW.id })
    });
    const d = await r.json();
    if (!d.ok) { notify('Error: ' + d.error, 'var(--red)'); return; }
    await fetchState();
    notify(`Purchase request sent to ${O[tgW.owner].name}`);
  };

  const sendSell = async (myW) => {
    const r = await fetch('/api/requests', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'sell', fromOwner: ME, myWid: myW.id })
    });
    const d = await r.json();
    if (!d.ok) { notify('Error: ' + d.error, 'var(--red)'); return; }
    await fetchState();
    notify(`Sale offer sent to all owners`);
  };

  const acceptReq = async (req) => {
    const r = await fetch(`/api/requests/${req.id}/respond`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ owner: ME, decision: 'accepted' })
    });
    const d = await r.json();
    if (!d.ok) { notify('Error: ' + d.error, 'var(--red)'); return; }
    await fetchState();
    notify('✓ Request accepted', 'var(--green)');
  };

  const declineReq = async (req) => {
    const r = await fetch(`/api/requests/${req.id}/respond`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ owner: ME, decision: 'declined' })
    });
    const d = await r.json();
    if (!d.ok) { notify('Error: ' + d.error, 'var(--red)'); return; }
    await fetchState();
    notify('✕ Request declined', 'var(--red)');
  };

  const slots       = buildSlots(weeks);
  const pendingCount = requests.filter(r => r.toOwner === ME && r.status === 'pending').length;
  const years        = yr === 'all' ? [1,2,3] : [parseInt(yr)];

  if (!weeks.length) {
    return (
      <div style={{ color: 'var(--gold)', padding: 60, textAlign: 'center', fontSize: 16, letterSpacing: 2 }}>
        LOADING…
      </div>
    );
  }

  return (
    <div style={{ minHeight: '100vh', background: 'var(--navy)' }}>
      {/* Toast */}
      {toast && (
        <div className="toast" style={{ borderLeftColor: toast.borderColor }}>{toast.msg}</div>
      )}

      {/* Modals */}
      {swapM    && <SwapModal myWeek={swapM.week} slots={slots} reqs={requests}
        onSend={sendSwap} onClose={() => setSwapM(null)} />}
      {buyM     && <BuyModal  week={buyM.week}
        onSend={sendBuy}  onClose={() => setBuyM(null)} />}
      {sellM    && <SellModal week={sellM.week}
        onSend={sendSell} onClose={() => setSellM(null)} />}
      {slotCalM && <SlotCalModal slot={slotCalM.slot} onClose={() => setSlotCalM(null)} />}

      {/* Header */}
      <Header pendingCount={pendingCount} onReset={async () => {
        await fetch('/api/reset', { method: 'POST' });
        await fetchState();
        setExp(null);
        notify('↺ All data reset');
      }} />

      <div style={{ maxWidth: 1060, margin: '0 auto', padding: '0 20px 60px' }}>
        <div style={{ height: 20 }} />

        <Tabelle slots={slots} reqs={requests} />
        <Inbox reqs={requests} slots={slots} onAccept={acceptReq} onDecline={declineReq} />
        <TxLog reqs={requests} slots={slots} />

        {/* Charter summary */}
        {(() => {
          const cw = allWeeks(slots).filter(w => w.owner === ME && w.status === 'charter');
          if (!cw.length) return null;
          return (
            <div style={{ background: 'var(--navy-mid)', borderRadius: 10, padding: '12px 16px', border: '1px solid rgba(106,160,186,.2)', marginBottom: 20 }}>
              <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 10, paddingBottom: 8, borderBottom: '1px solid rgba(106,160,186,.12)', color: 'var(--blue)' }}>
                Weeks released for charter ({cw.length}W)
              </div>
              <div className="charter-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 7, marginBottom: 10 }}>
                {cw.map(w => (
                  <div key={w.id} style={{ background: 'rgba(106,160,186,.06)', border: '1px solid rgba(106,160,186,.2)', borderRadius: 7, padding: '9px 10px' }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: 'var(--blue)' }}>{w.slotShort} W{w.wn}</div>
                    <div style={{ fontSize: 12, color: 'rgba(249,246,240,.35)' }}>{w.type === 'EU' ? 'Mediterranean' : 'Caribbean'}</div>
                    <div style={{ fontSize: 13, color: 'rgba(249,246,240,.55)', marginTop: 2 }}>{fmt(w.start)}</div>
                    <div style={{ fontWeight: 700, color: 'var(--blue)', fontSize: 12, marginTop: 2 }}>approx. {eur(CR)}</div>
                  </div>
                ))}
              </div>
              <div style={{ background: 'rgba(106,160,186,.06)', border: '1px solid rgba(106,160,186,.15)', borderRadius: 7, padding: '9px 12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <div style={{ fontWeight: 700, color: 'var(--blue)', fontSize: 12 }}>Net revenue (65% after broker + management)</div>
                  <div style={{ fontSize: 12, color: 'rgba(106,160,186,.5)' }}>{cw.length}W × {eur(CR)} × 65%</div>
                </div>
                <div style={{ fontWeight: 700, color: 'var(--blue)', fontSize: 18 }}>{eur(cw.length * CR * .65)}</div>
              </div>
            </div>
          );
        })()}

        {/* Tab bar + year filter */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20, flexWrap: 'wrap', gap: 10 }}>
          <div style={{ display: 'flex', gap: 6 }}>
            {[['cal','Calendar'],['over','Overview Calendar']].map(([k, l]) => (
              <button key={k} onClick={() => setTab(k)} style={{
                padding: '8px 16px', borderRadius: 20,
                border: `2px solid ${tab === k ? 'var(--gold)' : 'rgba(249,246,240,.12)'}`,
                background: tab === k ? 'rgba(184,147,42,.15)' : 'transparent',
                color: tab === k ? 'var(--gold)' : 'rgba(249,246,240,.5)',
                fontWeight: 700, fontSize: 13
              }}>{l}</button>
            ))}
          </div>
          {tab === 'cal' && (
            <div style={{ display: 'flex', gap: 5 }}>
              {[['all','All'],['1','Year 1'],['2','Year 2'],['3','Year 3']].map(([k, l]) => (
                <button key={k} onClick={() => setYr(k)} style={{
                  padding: '6px 12px', borderRadius: 20,
                  background: yr === k ? 'rgba(184,147,42,.15)' : 'transparent',
                  color: yr === k ? 'var(--gold)' : 'rgba(249,246,240,.4)',
                  border: `2px solid ${yr === k ? 'var(--gold)' : 'rgba(249,246,240,.1)'}`,
                  fontWeight: 700, fontSize: 12
                }}>{l}</button>
              ))}
            </div>
          )}
        </div>

        {/* My Weeks / All toggle — calendar tab only */}
        {tab === 'cal' && (
          <div style={{ display: 'flex', gap: 6, marginBottom: 16 }}>
            {[
              [false, 'My Weeks'],
              [true,  'Show All'],
            ].map(([val, label]) => (
              <button key={label}
                onClick={() => { setShowAll(val); if (!val) setExp(null); }}
                style={{
                  padding: '7px 16px', borderRadius: 20,
                  border: `2px solid ${showAll === val ? 'var(--gold)' : 'rgba(249,246,240,.12)'}`,
                  background: showAll === val ? 'rgba(184,147,42,.15)' : 'transparent',
                  color: showAll === val ? 'var(--gold)' : 'rgba(249,246,240,.4)',
                  fontWeight: 700, fontSize: 13,
                }}>
                {label}
              </button>
            ))}
          </div>
        )}

        {/* Overview tab */}
        {tab === 'over' && <Overview slots={slots} onSlotCal={sl => setSlotCalM({ slot: sl })} />}

        {/* Calendar tab */}
        {tab === 'cal' && years.map(y => {
          const ey = YEAR0 + y - 1;
          const allEu  = slots.filter(s => s.yr === y && s.type === 'EU');
          const allKar = slots.filter(s => s.yr === y && s.type === 'KAR');
          const eu  = showAll ? allEu  : allEu.filter(s => s.weeks.some(w => w.owner === ME));
          const kar = showAll ? allKar : allKar.filter(s => s.weeks.some(w => w.owner === ME));
          const myCount = allWeeks(slots).filter(w => w.owner === ME && w.yr === y).length;

          return (
            <div key={y} style={{ marginBottom: 32 }}>
              {/* Year header */}
              <div style={{
                background: 'linear-gradient(135deg, var(--navy-mid) 0%, #1A2E50 100%)',
                borderRadius: 12, padding: '13px 18px', marginBottom: 16,
                border: '1px solid rgba(184,147,42,.25)',
                display: 'flex', justifyContent: 'space-between', alignItems: 'center'
              }}>
                <div>
                  <div style={{ color: 'var(--gold)', fontWeight: 700, fontSize: 16 }}>Year {y}</div>
                  <div style={{ color: 'rgba(249,246,240,.35)', fontSize: 12 }}>Mediterranean {ey} · Caribbean {ey}–{ey+1}</div>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div style={{ color: 'rgba(249,246,240,.35)', fontSize: 13 }}>Your Weeks</div>
                  <div style={{ color: 'var(--gold)', fontWeight: 700, fontSize: 20 }}>{myCount}W</div>
                </div>
              </div>

              {/* EU section */}
              <div style={{ marginBottom: 16 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 10, paddingBottom: 8, borderBottom: '1px solid rgba(122,184,154,.12)' }}>
                  <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--green)' }} />
                  <span style={{ fontWeight: 700, fontSize: 13, color: 'var(--green)' }}>Mediterranean · {ey}</span>
                  <span style={{ fontSize: 12, color: 'rgba(249,246,240,.25)', marginLeft: 'auto' }}>Tap slot → plan weeks</span>
                </div>
                <div className="grid-3" style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10 }}>
                  {eu.map(s => (
                    <SlotCard key={s.id} slot={s} reqs={requests}
                      expanded={expanded === s.id}
                      onToggle={() => setExp(p => p === s.id ? null : s.id)} />
                  ))}
                  {eu.find(s => expanded === s.id) && (
                    <SlotCalPanel
                      slot={eu.find(s => expanded === s.id)}
                      slots={slots} reqs={requests}
                      onWeekAction={handleWeek}
                      onClose={() => setExp(null)} />
                  )}
                </div>
              </div>

              {/* KAR section */}
              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 10, paddingBottom: 8, borderBottom: '1px solid rgba(106,160,186,.12)' }}>
                  <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--blue)' }} />
                  <span style={{ fontWeight: 700, fontSize: 13, color: 'var(--blue)' }}>Caribbean · {ey}–{ey+1}</span>
                  <span style={{ fontSize: 12, color: 'rgba(249,246,240,.25)', marginLeft: 'auto' }}>Tap slot → plan weeks</span>
                </div>
                <div className="grid-3" style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10 }}>
                  {kar.map(s => (
                    <SlotCard key={s.id} slot={s} reqs={requests}
                      expanded={expanded === s.id}
                      onToggle={() => setExp(p => p === s.id ? null : s.id)} />
                  ))}
                  {kar.find(s => expanded === s.id) && (
                    <SlotCalPanel
                      slot={kar.find(s => expanded === s.id)}
                      slots={slots} reqs={requests}
                      onWeekAction={handleWeek}
                      onClose={() => setExp(null)} />
                  )}
                </div>
              </div>
            </div>
          );
        })}

        {/* Legend */}
        <div style={{ background: 'var(--navy-mid)', borderRadius: 9, padding: '10px 16px', display: 'flex', gap: 20, flexWrap: 'wrap', border: '1px solid rgba(249,246,240,.05)', marginTop: 8 }}>
          <span style={{ fontSize: 12, color: 'rgba(249,246,240,.2)', fontWeight: 600, alignSelf: 'center' }}>LEGEND</span>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
            {[['A', O.A.c], ['B', O.B.c], ['C', O.C.c]].map(([l, c]) => (
              <div key={l} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <div style={{ width: 8, height: 8, borderRadius: 2, background: c }} />
                <span style={{ fontSize: 12, color: 'rgba(249,246,240,.4)' }}>Owner {l}</span>
              </div>
            ))}
          </div>
          <div style={{ width: 1, background: 'rgba(249,246,240,.08)', alignSelf: 'stretch' }} />
          <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
            {[['var(--green)','✓ In Use'],['var(--blue)','Charter'],['rgba(249,246,240,.2)','○ Open']].map(([c,l]) => (
              <div key={l} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <div style={{ width: 8, height: 8, borderRadius: 2, background: c }} />
                <span style={{ fontSize: 12, color: 'rgba(249,246,240,.4)' }}>{l}</span>
              </div>
            ))}
          </div>
          <div style={{ width: 1, background: 'rgba(249,246,240,.08)', alignSelf: 'stretch' }} />
          <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
            {[['var(--gold)','Pending'],['var(--green)','✓ Accepted'],['var(--red)','✕ Declined']].map(([c,l]) => (
              <div key={l} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <div style={{ width: 8, height: 8, borderRadius: 2, background: c }} />
                <span style={{ fontSize: 12, color: 'rgba(249,246,240,.4)' }}>{l}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
